{% load i18n icons %}
{# Sits after the input in a .password-field: a tick once a new password is long enough or its repetition matches it, and a button that shows what was typed. #}
<div class="password-tools">
  {% icon "check" "password-ok" %}
  <button type="button" class="password-reveal" data-reveal-password aria-pressed="false"
          aria-label="{% translate 'Show password' %}" title="{% translate 'Show password' %}">
    {% icon "eye" "size-5 in-aria-pressed:hidden" %}{% icon "eye-off" "hidden size-5 in-aria-pressed:block" %}
  </button>
</div>
