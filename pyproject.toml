[project]
name = "absolved"
version = "0.0.1"
description = "Preparation for confession"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-ratelimit>=4.1.0",
    "gunicorn>=26.2.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "argon2-cffi>=25.1.0",
    "django-stubs>=6.1.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.0",
    "ty>=0.0.88",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["absolved/tests"]
# The browser tests run in Chromium and in WebKit, the engine of every browser on iOS.
addopts = "--browser chromium --browser webkit"
# An unrecognised key in this section is otherwise ignored.
strict_config = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "D", # Docstrings
    "COM812",
    "CPY001", # Copyright notices
    "TD",
    "TRY003",
    "EM101",
    "C901",
    "PLC0415",
    "PLR2004",
    "PLR0912",
    "ICN001", # datetime is imported by its own name
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",
    "S105", # Passwords the tests sign up with
]
"**/migrations/**" = ["RUF012"]
