name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The deploy job requires a tag ref, so pushes to main and pull requests only check: production only ever deploys
# from a release tag, and only once everything a deploy depends on has passed.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0

      # make check rebuilds the stylesheet to compare it with the committed one, which needs the release of the
      # Tailwind CLI the Makefile names, checked against the checksum the release published.
      - name: Install the Tailwind CLI
        run: |
          version=$(sed -n 's/^TAILWIND_VERSION := //p' Makefile)
          base="https://github.com/tailwindlabs/tailwindcss/releases/download/$version"
          curl -fsSLO "$base/tailwindcss-linux-x64"
          curl -fsSL "$base/sha256sums.txt" | grep ' ./tailwindcss-linux-x64$' | sed 's| ./| |' | sha256sum --check
          sudo install tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - run: uv sync --locked
      # The browsers' own system libraries, which make browsers leaves to the machine.
      - run: uv run playwright install-deps chromium webkit
      # make check compares each translation catalog with what msgfmt compiles it to. Installing the browsers'
      # libraries above has already refreshed the package lists.
      - run: sudo apt-get install --yes gettext
      - run: make browsers
      - run: make check

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # The tag names the release, and pyproject.toml says which version the code is.
      - name: Check the tag is the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but pyproject.toml says $version."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - uses: docker/setup-buildx-action@v4

      # Built here rather than on Fly's builder. load puts the image in the local Docker daemon, to be pushed once
      # authenticated, and the GitHub Actions cache reuses layers across runs.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: registry.fly.io/absolved:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Authenticated right before the push: Fly's registry tokens expire in about five minutes, which a slow build
      # could outlast.
      - name: Push the image to Fly's registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker
          docker push registry.fly.io/absolved:${{ github.ref_name }}

      # fly.toml's rolling strategy waits for the health check, so a release that cannot serve fails this step.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --app absolved --image registry.fly.io/absolved:${{ github.ref_name }}
