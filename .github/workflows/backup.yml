name: Backup

# The daily off-site copy of the production database, described in docs/backup.md. Fly's own volume
# snapshots are the first line and live in the same account as the thing they back up; this is the
# copy that does not.
#
# It runs here rather than on Fly because a Fly volume attaches to exactly one machine, so nothing
# scheduled alongside the app can read the database file. Actions cron is best-effort and can be
# delayed by an hour or more, which a daily copy can absorb.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    # Two runs at once would fight over the one filename the copy is written to on the volume.
    concurrency:
      group: backup
      cancel-in-progress: false
    # Its own token, not a deploy one: reading the database means an SSH session, and `fly tokens
    # create ssh` mints exactly that, for this app alone, and it cannot deploy.
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_SSH_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1

      # The machine is suspended when idle, and only a request through Fly's proxy wakes it; SSH does
      # not. The proxy answers once the app does, so the machine is up when this returns.
      - name: Wake the machine
        run: curl --fail --silent --show-error --output /dev/null https://absolved.be/health/

      # As the app's user: an SSH session is root, and a root process that opens the database can
      # leave its -wal and -shm files owned by root, which the app then cannot write. Absolute paths
      # because a command given to ssh console does not run through the image's entrypoint.
      - name: Copy the database out of the machine
        run: |
          flyctl ssh console -a absolved -C "setpriv --reuid=absolved --regid=absolved --init-groups /app/.venv/bin/python /app/manage.py backup_database /app/data/backup.sqlite3"
          flyctl sftp get /app/data/backup.sqlite3 backup.sqlite3 -a absolved

      # A backup nobody opened is a guess. This is the cheapest moment to find out that what
      # arrived is a database and is this application's, rather than during a restore.
      - name: Check what arrived
        run: |
          python3 - <<'PY'
          import sqlite3
          import sys

          copy = sqlite3.connect("file:backup.sqlite3?mode=ro", uri=True)
          integrity = copy.execute("pragma integrity_check").fetchone()[0]
          migrations = copy.execute("select count(*) from django_migrations").fetchone()[0]
          print(f"integrity_check: {integrity}, migrations applied: {migrations}")

          if integrity != "ok" or migrations == 0:
              sys.exit("Not keeping this copy.")
          PY

      # The copy holds usernames and confession dates in plaintext, so it leaves the runner
      # encrypted to a key only the owner holds, in the password store as other/absolved.be_backup_key;
      # this is its public half. One file per run, named for the moment it was taken, so nothing is
      # ever written over and a listing sorts oldest first, and the same name goes to both
      # destinations.
      - name: Compress, encrypt and name the copy
        id: seal
        env:
          AGE_RECIPIENT: age1agu5uhj2jmxafljwfks3awxu60k6uwhkku8v7wwzav4zftl5hp5qccwkta
        run: |
          sudo apt-get install -y --no-install-recommends age
          name="db-$(date -u +%Y%m%dT%H%M%SZ).sqlite3.gz.age"
          gzip -9 backup.sqlite3
          age --recipient "$AGE_RECIPIENT" --output "$name" backup.sqlite3.gz
          rm backup.sqlite3.gz
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"

      # The key this runs under is allowed s3:PutObject on this prefix and nothing else: it cannot
      # read the backups back and it cannot delete one. The bucket's lifecycle rule deletes each copy
      # after 30 days.
      - name: Upload to Tigris
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          aws s3api put-object \
            --endpoint-url https://fly.storage.tigris.dev \
            --bucket app-backups \
            --key "absolved/database/$BACKUP_FILE" \
            --body "$BACKUP_FILE"

      # The copy at a provider that has nothing to do with the application: Tigris is provisioned
      # and billed through Fly, so one lost account is both of them. Attempted even when Tigris
      # failed, and the other way round; either failure still fails the job, which is what sends
      # the email.
      #
      # rsync over port 23, the Storage Box's SSH service, which writes to a temporary name and
      # renames on completion, so an upload cut off halfway leaves nothing that looks like a backup.
      # The Storage Box has no lifecycle rules, so this deletes the copies older than 30 days, and
      # only once today's has arrived. The timestamp in each name says when it was taken.
      - name: Upload to the Storage Box and remove the copies past 30 days
        if: ${{ !cancelled() && steps.seal.outcome == 'success' }}
        env:
          SSH_KEY: ${{ secrets.STORAGE_BOX_SSH_KEY }}
          SSH_HOST: ${{ secrets.STORAGE_BOX_HOST }}
          KNOWN_HOSTS: ${{ secrets.STORAGE_BOX_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/storage_box
          chmod 600 ~/.ssh/storage_box
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          box() { ssh -n -p 23 -i ~/.ssh/storage_box -o IdentitiesOnly=yes "$SSH_HOST" "$@"; }

          rsync --times -e "ssh -p 23 -i ~/.ssh/storage_box -o IdentitiesOnly=yes" \
            "$BACKUP_FILE" "$SSH_HOST:$BACKUP_FILE"

          cutoff="db-$(date -u -d '30 days ago' +%Y%m%dT%H%M%SZ)"
          mapfile -t copies < <(box ls -1)
          for copy in "${copies[@]}"; do
            if [[ "$copy" == db-*.sqlite3.gz.age && "$copy" < "$cutoff" ]]; then
              box rm "$copy"
            fi
          done

      # A 1 GB volume has room for one transient second copy, not one per run. Removed even when the
      # fetch failed, which is when it is left behind; a leftover is replaced by the next run anyway.
      - name: Remove the copy from the machine
        if: always()
        run: flyctl ssh console -a absolved -C "rm -f /app/data/backup.sqlite3"
